{{ define "main" }}
<div class="post">
  
</div>
<h3 align="center">纵意游肆，名山胜川靡不穷究。</h3> <p align="right"> ————《晋书·孙统传》</p>
<hr />
<div class="fullscreen">
  {{ range (os.ReadDir "static/photos") }}
    {{- if not .IsDir }}
    {{- $n := .Name }}
    {{- if in (slice ".jpg" ".jpeg" ".png" ".webp" ".gif" ".jfif" ".avif") (lower (path.Ext $n)) }}
  <figure>
    <img loading="lazy" decoding="async"
         src="{{ (printf "photos/%s" $n) | absURL }}"
         alt="{{ $n }}" />
    <figcaption>{{ $n | replaceRE "\\.[^.]+$" "" }}</figcaption>
  </figure>
    {{- end }}
    {{- end }}
  {{ end }}
<script src="//cdn.grer.cn/js/view-image.js"></script>
<script>
  window.ViewImage && ViewImage.init('.fullscreen img')
</script>
</div>
<style type="text/css">
figure {
  opacity: 0.88;
  position: relative; /* 为绝对定位子元素建立参照 */
}
figure:hover {
  position: relative;
  transform: scale(1.025);
  opacity: 1;
  transition: transform 0.3s, opacity 0.3s;
}
figcaption {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  font-weight: 600;
  text-align: center;
  background: rgba(0,0,0,0.4);
  color: white;
  font-size: 12px;
  padding: 4px 8px;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  z-index: 2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  box-sizing: border-box;
  max-width: 100%; /* 防止超出容器 */
}
figure:hover figcaption {
  opacity: 1;
}
</style>
{{ end }}
