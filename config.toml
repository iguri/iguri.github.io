baseURL = "https://grer.cn"
title = "故人笔记 - 甲拉古日的自留地"
locale = "zh-CN"
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false
theme = "PaperMod"

# 显式时区，避免无 TZ 的 date 在不同环境被解释成 UTC 而错位一天
timeZone = "Asia/Shanghai"

# CJK 分词：中文字数/摘要按字计算（有效键是 hasCJKLanguage，大小写不敏感）
hasCJKLanguage = true
summaryLength = 60

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

# 站点底栏备案信息
Copyright = '<a href="//www.beian.gov.cn/portal/registerSystemInfo?recordcode=51343702000108" target="_blank" rel="noopener">川公网安备51343702000108号</a> | <a href="//beian.miit.gov.cn" target="_blank" rel="noopener">蜀ICP备2021023818号-2</a> | <a href="//icp.gov.moe/?keyword=20223334" target="_blank" rel="noopener">萌ICP备20223334号</a> </br>&copy; 2026 <a href="/about/#我">甲拉古日</a>'

[minify]
disableXML = true
minifyOutput = true

# 项目里所有文章的文件名都不以 YYYY-MM-DD 开头，":filename" 永远命中不了，
# 且会让缺 date 的页面（index.md 等）落到 0001-01-01。故只保留默认解析顺序。
[frontmatter]
date = [ ":default" ]

[permalinks]
blog = "/blog/:slug.html"
page = "/:slug"

[pagination]
pagerSize = 12
path = "page"

[params]
env = "production"
title = "故人笔记 - 甲拉古日的自留地"
description = "故人笔记 - 甲拉古日的自留地; 随手记录生活与灵感瞬间的创作。"
keywords = [ "故人笔记", "甲拉古日", "个人网站", "灵感创作" ]
author = "甲拉古日"
DateFormat = "2006-01-02"

# 以下开关按 PaperMod v8 模板实际读取的键名书写（.Param 调用大小写不敏感）
ShowToc = true
TocOpen = true
ShowCodeCopyButtons = true
ShowReadingTime = false
ShowWordCount = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowShareButtons = true
ShowRssButtonInSectionTermList = false
hideMeta = false
hideSummary = false
hideFooter = false
hideAuthor = false
disableSpecial1stPost = true
disableScrollToTop = false
disableThemeToggle = false
defaultTheme = "auto"
comments = true

shareButtons = [
  "wechat",
  "weibo",
  "qzone",
  "qq",
  "linkedin",
  "telegram",
  "link"
]

  [params.footer]
  text = ""

  [params.twikoo]
  version = "1.6.39"

  [params.assets]
  favicon = "/favicon.ico"
  favicon16x16 = "/favicon.ico"
  favicon32x32 = "/favicon.ico"
  apple_touch_icon = "/favicon.ico"
  safari_pinned_tab = "/favicon.ico"

  [params.label]
  text = "故人笔记"
  # icon = "/images/icon.png"   # 主题只认 label.icon（assets 资源路径）；iconSVG 并非有效键
  # iconHeight = 30

  [params.profileMode]
  enabled = true
  title = "<h5>审阅自己 、 超越自己 、 取悦自己</h5>"
  imageUrl = "/images/logo.png"
  imageWidth = 180
  imageHeight = 160
  imageTitle = "Welcome To My BLOG"

  [params.homeInfoParams]
  Title = "故人笔记"
  Content = "Now, just be happy"

  [[params.socialIcons]]
  name = "github"
  url = "//github.com/iguri"

  [[params.socialIcons]]
  name = "weibo"
  url = "//weibo.com/u/5898165577"

  [[params.socialIcons]]
  name = "bilibili"
  url = "//space.bilibili.com/477119718"

  [[params.socialIcons]]
  name = "steam"
  url = "//steamcommunity.com/id/migrer"

  [[params.socialIcons]]
  name = "telegram"
  url = "//t.me/grlol"

  [params.cover]
  responsiveImages = true
  hidden = false
  hiddenInList = false
  hiddenInSingle = true

  [params.editPost]
  URL = "//github.com/iguri/iguri.github.io/blob/main/content"
  Text = "edit"
  appendFilePath = true

  [params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  location = 0
  distance = 1000
  threshold = 0.4
  minMatchCharLength = 2
  keys = [ "title", "permalink", "summary", "content" ]

[[languages.zh.menu.main]]
identifier = "search"
name = "搜索"
url = "/search"
weight = 20

[[languages.zh.menu.main]]
identifier = "archives"
name = "归档"
url = "/archives"
weight = 30

[[languages.zh.menu.main]]
identifier = "about"
name = "关于"
url = "/about"
weight = 40

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
# noClasses = false：交给主题内置的 Chroma CSS（暗色系），比内联样式体积小且可随主题切换
# style 无需设置：PaperMod 自带 chroma-styles.css 会覆盖这里的取值
noClasses = false
codeFences = true
guessSyntax = false      # 关闭语法猜测，避免 mermaid 等非代码块被误判着色
hl_Lines = ""
lineAnchors = ""
lineNoStart = 1
lineNos = false
lineNumbersInTable = false
tabWidth = 4

[outputs]
home = [ "HTML", "RSS", "JSON" ]

[security]
  allowContent = [ 'text/markdown', 'text/html' ]
